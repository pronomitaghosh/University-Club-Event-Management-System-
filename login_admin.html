<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central Admin | CPC Kishoreganj University</title>
    <script>
        window.location.replace('index.html');
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --deep-admin: #0d2321;
            --teal: #1a7a6e;
            --teal-dark: #125a51;
            --white: #ffffff;
            --bg: #ebf3f2;
            --text: #1e2d2b;
        }
        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(45deg, var(--deep-admin) 0%, #173d39 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px;
        }
        .admin-box {
            background: var(--white);
            padding: 45px 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 430px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            text-align: center;
        }
        .icon { font-size: 3rem; margin-bottom: 12px; display: inline-block; }
        h2 { font-family: 'Playfair Display', serif; color: var(--deep-admin); margin-bottom: 8px; font-size: 1.8rem; }
        p { color: #728481; font-size: 0.9rem; margin-bottom: 35px; }
        .form-group { text-align: left; margin-bottom: 22px; }
        .message { margin-bottom: 18px; min-height: 1.2em; font-weight: 600; }
        label { display: block; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--deep-admin); margin-bottom: 8px; }
        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #cde5e2;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            background: #fcfdfe;
            transition: all 0.2s;
        }
        input:focus { outline: none; border-color: var(--deep-admin); box-shadow: 0 0 0 3px rgba(13, 35, 33, 0.1); }
        .btn-admin {
            width: 100%;
            padding: 15px;
            background: var(--deep-admin);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
            letter-spacing: 0.5px;
        }
        .btn-admin:hover { background: #173d39; }
        .back-link { display: inline-block; margin-top: 25px; color: var(--teal); text-decoration: none; font-size: 0.9rem; font-weight: 500; }
        .back-link:hover { color: var(--deep-admin); text-decoration: underline; }
    </style>
</head>
<body>

    <div class="admin-box">
        <span class="icon">🛡️</span>
        <h2>Central Admin</h2>
        <p>Secure infrastructure access portal</p>
        <div id="message" class="message"></div>
        
        <form action="login.php" method="POST" autocomplete="off" novalidate>
            <div style="position:absolute;left:-9999px;visibility:hidden;">
                <input type="text" name="fake_username" autocomplete="username">
                <input type="password" name="fake_password" autocomplete="current-password">
            </div>
            <input type="hidden" name="role" value="admin">
            <div class="form-group">
                <label for="admin-id">Admin Username</label>
                <input type="text" id="admin-id" name="identifier" autocomplete="username" placeholder="admin_root" required>
            </div>
            <div class="form-group">
                <label for="admin-pass">Secure Password</label>
                <input type="password" id="admin-pass" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-admin">Verify & Enter</button>
        </form>

        <a href="index.html" class="back-link">← Return to Main Site</a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const message = document.getElementById('message');
        if (params.get('success')) {
            message.textContent = decodeURIComponent(params.get('success'));
            message.style.color = '#0f6d3a';
        } else if (params.get('error')) {
            message.textContent = decodeURIComponent(params.get('error'));
            message.style.color = '#d93838';
        }
    </script>
</body>
</html>
