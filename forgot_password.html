<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | CPC</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --teal: #1a7a6e;
            --teal-dark: #125a51;
            --deep: #0e3d38;
            --white: #ffffff;
            --bg: #f4f9f8;
            --text: #1e2d2b;
        }
        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, #e6f5f3 0%, var(--bg) 100%);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .reset-box {
            background: var(--white); padding: 40px; border-radius: 16px;
            border: 1px solid #cde5e2; width: 100%; max-width: 420px;
            box-shadow: 0 10px 30px rgba(26, 122, 110, 0.06); text-align: center;
        }
        .icon { font-size: 3rem; margin-bottom: 10px; display: inline-block; }
        h2 { font-family: 'Playfair Display', serif; color: var(--deep); margin-bottom: 10px; font-size: 1.8rem; }
        p { color: #6b7f7d; font-size: 0.9rem; margin-bottom: 25px; line-height: 1.5; }
        .form-group { text-align: left; margin-bottom: 20px; }
        label { display: block; font-size: 0.9rem; font-weight: 600; color: var(--deep); margin-bottom: 8px; }
        label .required { color: #d93838; margin-left: 3px; }
        input {
            width: 100%; padding: 12px 16px; border: 1px solid #cde5e2;
            border-radius: 8px; font-family: inherit; font-size: 0.95rem; transition: all 0.2s;
        }
        input:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(26, 122, 110, 0.1); }
        .btn-submit {
            width: 100%; padding: 14px; background: var(--teal); color: var(--white);
            border: none; border-radius: 8px; font-size: 1rem; font-weight: 700;
            cursor: pointer; transition: background 0.2s;
        }
        .btn-submit:hover { background: var(--teal-dark); }
        .back-link { display: inline-block; margin-top: 25px; color: var(--teal); text-decoration: none; font-size: 0.9rem; font-weight: 500; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="reset-box">
        <span class="icon">🔑</span>
        <h2>Forgot Password?</h2>
        <p>Enter your registered email below, and we will send you an OTP to reset your password.</p>
        
        <form action="verify_otp.html" method="GET">
            <div class="form-group">
                <label for="email">Email Address<span class="required">*</span></label>
                <input type="email" id="email" placeholder="Enter your email address" required>
            </div>
            <button type="submit" class="btn-submit">Send Reset OTP</button>
        </form>

        <a href="login_student.html" class="back-link">← Back to Sign In</a>
    </div>

</body>
</html>
