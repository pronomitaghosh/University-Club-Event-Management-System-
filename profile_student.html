<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0;url=profile_student.php">
    <title>Redirecting... | CPC Profile</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --teal: #1a7a6e; --teal-dark: #125a51; --teal-light: #e6f5f3; --deep: #0e3d38; --gold: #c89b3c; --text: #1e2d2b; --muted: #6b7f7d; --white: #ffffff; --bg: #f4f9f8; --border: #cde5e2; --sidebar-width: 260px; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); min-height: 100vh; display: flex; }
        .sidebar { width: var(--sidebar-width); background: linear-gradient(180deg, var(--deep) 0%, var(--teal-dark) 100%); color: var(--white); position: fixed; top: 0; bottom: 0; left: 0; display: flex; flex-direction: column; z-index: 100; }
        .sidebar-header { padding: 24px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); text-align: center; }
        .sidebar-header h2 { font-family: 'Playfair Display', serif; font-size: 1.1rem; }
        .sidebar-menu { list-style: none; padding: 24px 16px; flex: 1; }
        .menu-link { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: rgba(255, 255, 255, 0.75); text-decoration: none; font-size: 0.95rem; font-weight: 500; border-radius: 10px; }
        .menu-link:hover, .menu-link.active { color: var(--white); background: rgba(255, 255, 255, 0.15); }
        .menu-link.active { border-left: 4px solid var(--gold); background: rgba(255, 255, 255, 0.1); }
        .sidebar-footer { padding: 20px 24px; border-top: 1px solid rgba(255, 255, 255, 0.1); }
        .btn-logout { display: flex; align-items: center; gap: 10px; color: #ff8a8a; text-decoration: none; font-size: 0.9rem; font-weight: 600; }
        .main-wrapper { margin-left: var(--sidebar-width); flex: 1; display: flex; flex-direction: column; }
        .topbar { background: var(--white); height: 70px; padding: 0 40px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
        .role-badge { padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; background: var(--teal-light); color: var(--teal-dark); }
        
        .content-body { padding: 40px; max-width: 800px; }
        .page-title { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--deep); margin-bottom: 30px; }
        
        .profile-card { background: var(--white); border-radius: 20px; border: 1px solid var(--border); padding: 35px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        @media(max-width: 600px){ .form-grid { grid-template-columns: 1fr; } }
        
        .form-group { display: flex; flex-direction: column; }
        label { font-size: 0.9rem; font-weight: 600; color: var(--deep); margin-bottom: 8px; }
        input, select { padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 0.95rem; color: var(--text); transition: all 0.2s; }
        input:focus, select:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(26, 122, 110, 0.1); }
        
        .btn-save { padding: 14px 30px; background: var(--teal); color: var(--white); border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn-save:hover { background: var(--teal-dark); }
        
        /* Alert Message Popup */
        .alert-success { background: #d4edda; color: #155724; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; font-size: 0.95rem; font-weight: 500; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header"><div class="logo">💻</div><h2>CPC Portal</h2></div>
        <ul class="sidebar-menu">
            <li><a href="dashboard_student.html" class="menu-link">📊 Dashboard</a></li>
            <li><a href="events_student.html" class="menu-link">📅 Club Events</a></li>
            <li><a href="announcements_student.html" class="menu-link">📬 Announcements</a></li>
            <li><a href="profile_student.html" class="menu-link active">👤 My Profile</a></li>
        </ul>
        <div class="sidebar-footer"><a href="index.html" class="btn-logout">🚪 Logout</a></div>
    </div>

    <div class="main-wrapper">
        <div class="topbar"><span class="role-badge">💻 CPC Member</span><strong>Rafiul Islam</strong></div>
        
        <div class="content-body">
            <h1 class="page-title">Manage Profile Details</h1>
            
            <div class="profile-card">
                <div class="alert-success" id="successMsg">✓ Profile updated successfully! Changes are saved.</div>
                
                <form id="profileForm" onsubmit="saveProfile(event)">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" value="Rafiul Islam" required id="p-name">
                        </div>
                        <div class="form-group">
                            <label>Student ID</label>
                            <input type="text" value="2024-1105-010" readonly style="background: #f1f5f4; cursor: not-allowed;">
                        </div>
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" value="rafiul.cse@university.edu" required id="p-email">
                        </div>
                        <div class="form-group">
                            <label>Department</label>
                            <select id="p-dept">
                                <option value="CSE" selected>Computer Science & Engineering (CSE)</option>
                                <option value="EEE">EEE</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn-save">Save Profile Changes</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // রিয়েল-টাইম ক্লায়েন্ট সাইড আপডেট ফিল দেওয়ার জাভাস্ক্রিপ্ট
        function saveProfile(e) {
            e.preventDefault();
            document.getElementById('successMsg').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            setTimeout(() => {
                document.getElementById('successMsg').style.display = 'none';
            }, 4000);
        }
    </script>
</body>
</html>
