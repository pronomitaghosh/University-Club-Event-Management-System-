<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>President Portal | CPC Kishoreganj University</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --teal: #1a7a6e;
            --teal-dark: #125a51;
            --deep: #0e3d38;
            --gold: #c89b3c;
            --white: #ffffff;
            --bg: #f4f9f8;
            --text: #1e2d2b;
        }
        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, #e6f5f3 0%, var(--bg) 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-container {
            background: var(--white);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid #cde5e2;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(26, 122, 110, 0.08);
            text-align: center;
        }
        .icon { font-size: 3rem; margin-bottom: 10px; display: inline-block; }
        h2 { font-family: 'Playfair Display', serif; color: var(--deep); margin-bottom: 8px; font-size: 1.8rem; }
        p { color: #6b7f7d; font-size: 0.9rem; margin-bottom: 30px; }
        .form-group { text-align: left; margin-bottom: 20px; }
        .message { margin-bottom: 18px; min-height: 1.2em; font-weight: 600; }
        label { display: block; font-size: 0.9rem; font-weight: 600; color: var(--deep); margin-bottom: 8px; }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #cde5e2;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text);
            transition: all 0.2s;
        }
        input:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(26, 122, 110, 0.1); }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--teal);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn-submit:hover { background: var(--teal-dark); }
        .back-link { display: inline-block; margin-top: 20px; color: var(--teal); text-decoration: none; font-size: 0.9rem; font-weight: 500; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="login-container">
        <span class="icon">👑</span>
        <h2>President Portal</h2>
        <p>Sign in to manage club events and operations</p>
        <div id="message" class="message"></div>
        
        <form action="login.php" method="POST" autocomplete="off" novalidate>
            <div style="position:absolute;left:-9999px;visibility:hidden;">
                <input type="text" name="fake_username" autocomplete="username">
                <input type="password" name="fake_password" autocomplete="current-password">
            </div>
            <input type="hidden" name="role" value="president">
            <div class="form-group">
                <label for="username">President Email / ID</label>
                <input type="text" id="username" name="identifier" autocomplete="username" placeholder="president@university.edu" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">Access Dashboard</button>
        </form>

        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const message = document.getElementById('message');
        if (params.get('success')) {
            message.textContent = decodeURIComponent(params.get('success'));
            message.style.color = '#0f6d3a';
        } else if (params.get('error')) {
            message.textContent = decodeURIComponent(params.get('error'));
            message.style.color = '#d93838';
        }
    </script>
</body>
</html>
