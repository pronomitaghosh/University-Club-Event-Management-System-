<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | CPC</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --teal: #1a7a6e;
            --teal-dark: #125a51;
            --deep: #0e3d38;
            --white: #ffffff;
            --bg: #f4f9f8;
            --text: #1e2d2b;
        }
        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, #e6f5f3 0%, var(--bg) 100%);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .reset-box {
            background: var(--white); padding: 40px; border-radius: 16px;
            border: 1px solid #cde5e2; width: 100%; max-width: 420px;
            box-shadow: 0 10px 30px rgba(26, 122, 110, 0.06);
        }
        h2 { font-family: 'Playfair Display', serif; color: var(--deep); text-align: center; margin-bottom: 8px; font-size: 1.8rem; }
        p { color: #6b7f7d; font-size: 0.9rem; text-align: center; margin-bottom: 30px; }
        .form-group { text-align: left; margin-bottom: 20px; }
        label { display: block; font-size: 0.9rem; font-weight: 600; color: var(--deep); margin-bottom: 8px; }
        label .required { color: #d93838; margin-left: 3px; }
        input {
            width: 100%; padding: 12px 16px; border: 1px solid #cde5e2;
            border-radius: 8px; font-family: inherit; font-size: 0.95rem; transition: all 0.2s;
        }
        input:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(26, 122, 110, 0.1); }
        .btn-update {
            width: 100%; padding: 14px; background: var(--teal); color: var(--white);
            border: none; border-radius: 8px; font-size: 1rem; font-weight: 700;
            cursor: pointer; transition: background 0.2s; margin-top: 10px;
        }
        .btn-update:hover { background: var(--teal-dark); }
    </style>
</head>
<body>

    <div class="reset-box">
        <h2>Create New Password</h2>
        <p>Set your secure new password for account access.</p>
        
        <form action="#" method="POST">
            <div class="form-group">
                <label for="new-pass">New Password<span class="required">*</span></label>
                <input type="password" id="new-pass" placeholder="Minimum 6 characters" required>
            </div>
            
            <div class="form-group">
                <label for="confirm-pass">Confirm New Password<span class="required">*</span></label>
                <input type="password" id="confirm-pass" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-update">Update Password</button>
        </form>
    </div>

</body>
</html>
