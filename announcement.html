<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements | CPC</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght=700;900&family=DM+Sans:wght=400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="nav-logo">
            <img src="ClubLogo.jpg" alt="Logo" style="width: 35px; height: 35px; object-fit: contain;">
            <span>Computer & Programming Club<br>Kishoreganj University</span>
        </a>
        <div class="hamburger"><span></span><span></span><span></span></div>
        <div class="nav-container">
            <div class="nav-links"><a href="index.html">Home</a><a href="about.html">About</a><a href="committee.html">Committee</a><a href="events.html">Events</a><a href="achievements.html">Achievements</a><a href="announcement.html" class="active">Announcement</a><a href="resources.html">Resources</a><a href="contact.html">Contact</a></div>
        </div>
    </nav>

    <header class="page-header">
        <h1>Official Announcements</h1>
        <p>Get the latest notice and updates instantly.</p>
    </header>

    <style>
        .announcement-list {
            display: flex;
            flex-direction: column;
            gap: 22px;
            max-width: 980px;
            margin: 0 auto;
        }

        .announcement-card {
            background: var(--white);
            border: 1px solid rgba(14, 61, 56, 0.12);
            border-left: 5px solid var(--gold);
            border-radius: 18px;
            padding: 24px 26px;
            box-shadow: 0 18px 36px rgba(14, 61, 56, 0.06);
        }

        .announcement-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 10px;
            color: var(--gold);
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .announcement-card h3 {
            color: var(--deep);
            margin: 8px 0 10px;
            font-size: 1.5rem;
            font-family: 'Playfair Display', serif;
        }

        .announcement-card p {
            color: #444;
            line-height: 1.8;
            white-space: pre-wrap;
        }

        .announcement-empty {
            background: var(--white);
            border: 1px solid rgba(14, 61, 56, 0.12);
            border-radius: 18px;
            padding: 28px 24px;
            text-align: center;
            color: #5d6d6b;
        }
    </style>

    <main class="main-content">
        <div id="announcement-list" class="announcement-list"></div>
    </main>

    <script src="script.js"></script>
    <script>
        async function loadAnnouncements() {
            const container = document.getElementById('announcement-list');

            try {
                const response = await fetch('fetch_notices.php');
                if (!response.ok) {
                    throw new Error('Failed to load announcements');
                }

                const notices = await response.json();

                if (!Array.isArray(notices) || notices.length === 0) {
                    container.innerHTML = '<div class="announcement-empty">📭 No announcements have been posted yet.</div>';
                    return;
                }

                const cards = notices.map((notice) => {
                    const title = escapeHtml(notice.title || 'Untitled Notice');
                    const body = escapeHtml(notice.body || '');
                    const date = formatDate(notice.created_at);
                    const pinBadge = Number(notice.pinned) === 1 ? '<span style="background:#fff4d6;color:#8a6a0a;border-radius:999px;padding:4px 10px;font-size:0.7rem;font-weight:700;letter-spacing:0.04em;">Pinned</span>' : '';

                    return `
                        <article class="announcement-card">
                            <div class="announcement-meta">
                                <span>Posted on: ${date}</span>
                                ${pinBadge}
                            </div>
                            <h3>${title}</h3>
                            <p>${body}</p>
                        </article>
                    `;
                }).join('');

                container.innerHTML = cards;
            } catch (error) {
                container.innerHTML = '<div class="announcement-empty">⚠️ Unable to load announcements right now. Please try again later.</div>';
            }
        }

        function formatDate(dateString) {
            if (!dateString) return 'Recently';
            const date = new Date(dateString);
            if (Number.isNaN(date.getTime())) return dateString;
            return date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            }).toUpperCase();
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        document.addEventListener('DOMContentLoaded', loadAnnouncements);
    </script>
</body>
</html>
