<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP | CPC</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght=700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --teal: #1a7a6e;
            --teal-dark: #125a51;
            --deep: #0e3d38;
            --white: #ffffff;
            --bg: #f4f9f8;
            --text: #1e2d2b;
        }
        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, #e6f5f3 0%, var(--bg) 100%);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .otp-box {
            background: var(--white); padding: 40px; border-radius: 16px;
            border: 1px solid #cde5e2; width: 100%; max-width: 420px;
            box-shadow: 0 10px 30px rgba(26, 122, 110, 0.06); text-align: center;
        }
        .icon { font-size: 3rem; margin-bottom: 10px; display: inline-block; }
        h2 { font-family: 'Playfair Display', serif; color: var(--deep); margin-bottom: 10px; font-size: 1.8rem; }
        p { color: #6b7f7d; font-size: 0.9rem; margin-bottom: 25px; line-height: 1.5; }
        .otp-inputs { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; }
        
        /* ৬ ডিজিট ওটিপির জন্য বক্স ডিজাইন */
        .otp-field {
            width: 45px; height: 50px; text-align: center; font-size: 1.3rem;
            font-weight: 700; border: 1px solid #cde5e2; border-radius: 8px;
            color: var(--deep); transition: all 0.2s;
        }
        .otp-field:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(26, 122, 110, 0.1); }
        
        .btn-verify {
            width: 100%; padding: 14px; background: var(--teal); color: var(--white);
            border: none; border-radius: 8px; font-size: 1rem; font-weight: 700;
            cursor: pointer; transition: background 0.2s;
        }
        .btn-verify:hover { background: var(--teal-dark); }
        .resend-text { margin-top: 20px; font-size: 0.85rem; color: #6b7f7d; }
        .resend-text a { color: #c89b3c; text-decoration: none; font-weight: 600; }
        .resend-text a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="otp-box">
        <span class="icon">💬</span>
        <h2>Enter Verification Code</h2>
        <p>We've sent a 6-digit verification code to your email. Enter it below to proceed.</p>
        
        <form action="reset_password.html" method="GET">
            <div class="otp-inputs">
                <input type="text" class="otp-field" maxlength="1" required>
                <input type="text" class="otp-field" maxlength="1" required>
                <input type="text" class="otp-field" maxlength="1" required>
                <input type="text" class="otp-field" maxlength="1" required>
                <input type="text" class="otp-field" maxlength="1" required>
                <input type="text" class="otp-field" maxlength="1" required>
            </div>
            <button type="submit" class="btn-verify">Verify Code</button>
        </form>

        <p class="resend-text">Didn't receive the code? <a href="#">Resend Code</a></p>
    </div>

    <script>
        // ওটিপি বক্সে একটি সংখ্যা লিখলে অটো পরের বক্সে কার্সার চলে যাওয়ার চমৎকার স্ক্রিপ্ট
        const inputs = document.querySelectorAll('.otp-field');
        inputs.forEach((input, index) => {
            input.addEventListener('keyup', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
                if (e.key === "Backspace" && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });
    </script>
</body>
</html>
