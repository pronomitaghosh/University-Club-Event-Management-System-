<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events | CPC</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="nav-logo">
            <img src="ClubLogo.jpg" alt="Logo" style="width: 35px; height: 35px; object-fit: contain;">
            <span>Computer & Programming Club<br>Kishoreganj University</span>
        </a>
        <div class="hamburger"><span></span><span></span><span></span></div>
        <div class="nav-container">
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="committee.html">Committee</a>
                <a href="events.html" class="active">Events</a>
                <a href="achievements.html">Achievements</a>
                <a href="announcement.html">Announcement</a>
                <a href="resources.html">Resources</a>
                <a href="contact.html">Contact</a>
            </div>
        </div>
    </nav>

    <header class="page-header">
        <h1>Upcoming & Past Events</h1>
        <p>Stay updated with our latest workshops, hackathons, and contests.</p>
    </header>

    <main class="main-content">
        <div id="eventsList" class="grid-container">
            <div class="card loading-card">Loading events from the database...</div>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const container = document.getElementById('eventsList');

            fetch('events.php')
                .then(function (response) {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.text();
                })
                .then(function (html) {
                    container.innerHTML = html;
                })
                .catch(function () {
                    container.innerHTML = '<div class="card empty-state">Unable to load events right now. Please try again later.</div>';
                });
        });
    </script>
</body>
</html>
