<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>All Clubs</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        /* সেম টু সেম কোড স্ট্রাকচার */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --teal: #1a7a6e;
            --teal-dark: #125a51;
            --teal-light: #e6f5f3;
            --deep: #0e3d38;
            --gold: #c89b3c;
            --text: #1e2d2b;
            --muted: #6b7f7d;
            --white: #ffffff;
            --bg: #f4f9f8;
            --border: #cde5e2;
            --sidebar-width: 260px;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: linear-gradient(180deg, var(--deep) 0%, var(--teal-dark) 100%);
            color: var(--white);
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 24px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.15rem;
        }

        .sidebar-menu {
            list-style: none;
            padding: 24px 16px;
            flex: 1;
        }

        .menu-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: rgba(255, 255, 255, 0.75);
            text-decoration: none;
            font-size: 0.95rem;
            border-radius: 10px;
        }

        .menu-link:hover,
        .menu-link.active {
            color: var(--white);
            background: rgba(255, 255, 255, 0.15);
        }

        .menu-link.active {
            border-left: 4px solid var(--gold);
        }

        .main-wrapper {
            margin-left: var(--sidebar-width);
            flex: 1;
            padding: 40px;
        }

        .club-card {
            background: white;
            padding: 24px;
            border-radius: 16px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .btn-join {
            padding: 8px 16px;
            background: var(--teal);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="logo">🎓</div>
            <h2>Club & Event Panel</h2>
        </div>
        <ul class="sidebar-menu">
            <li><a href="dashboard_student.html" class="menu-link">📊 Dashboard</a></li>
            <li><a href="clubs_student.html" class="menu-link active">🏅 All Clubs</a></li>
            <li><a href="events_student.html" class="menu-link">📅 Registered Events</a></li>
            <li><a href="announcements_student.html" class="menu-link">📬 Announcements</a></li>
            <li><a href="profile_student.php" class="menu-link">👤 My Profile</a></li>
        </ul>
        <div class="sidebar-footer" style="padding: 20px 24px;"><a href="login.html"
                style="color: #ff8a8a; text-decoration:none; font-weight:600;">🚪 Logout</a></div>
    </div>
    <div class="main-wrapper">
        <h1 style="font-family:'Playfair Display', serif; margin-bottom: 20px;">Explore Clubs</h1>
        <div class="club-card">
            <h3>Computer Programming Club</h3>
            <p style="color: var(--muted); margin: 8px 0 15px 0;">Official club for devs and competitive programmers.
            </p>
            <button class="btn-join">Join Club</button>
        </div>
    </div>
</body>

</html>
