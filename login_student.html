<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | CPC</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght=700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --teal: #1a7a6e;
            --teal-dark: #125a51;
            --deep: #0e3d38;
            --white: #ffffff;
            --bg: #f4f9f8;
            --text: #1e2d2b;
        }
        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, #e6f5f3 0%, var(--bg) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-box {
            background: var(--white);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid #cde5e2;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(26, 122, 110, 0.06);
            text-align: center;
        }
        .icon { font-size: 3rem; margin-bottom: 10px; display: inline-block; }
        h2 { font-family: 'Playfair Display', serif; color: var(--deep); margin-bottom: 25px; font-size: 1.8rem; }
        .form-group { text-align: left; margin-bottom: 20px; position: relative; }
        .message { margin-bottom: 20px; min-height: 24px; font-weight: 600; }
        label { display: block; font-size: 0.9rem; font-weight: 600; color: var(--deep); margin-bottom: 8px; }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #cde5e2;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        input:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(26, 122, 110, 0.1); }
        
        .forgot-link {
            display: block;
            text-align: right;
            margin-top: -12px;
            margin-bottom: 25px;
            font-size: 0.85rem;
            color: #c89b3c;
            text-decoration: none;
            font-weight: 500;
        }
        .forgot-link:hover { text-decoration: underline; }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--teal);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-login:hover { background: var(--teal-dark); }
        
        .switch-text { margin-top: 25px; font-size: 0.9rem; color: #6b7f7d; }
        .switch-text a { color: var(--teal); text-decoration: none; font-weight: 600; }
        .switch-text a:hover { text-decoration: underline; }
        .back-home { display: inline-block; margin-top: 20px; color: #8fa4a1; text-decoration: none; font-size: 0.85rem; }
    </style>
</head>
<body>

    <div class="login-box">
        <span class="icon">👨‍💻</span>
        <h2>Student Sign In</h2>
        <div id="message" class="message"></div>
        
        <form action="login.php" method="POST" autocomplete="off" novalidate>
            <div style="position:absolute;left:-9999px;visibility:hidden;">
                <input type="text" name="fake_username" autocomplete="username">
                <input type="password" name="fake_password" autocomplete="current-password">
            </div>
            <input type="hidden" name="role" value="student">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="identifier" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" placeholder="Enter your email address" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="new-password" placeholder="Enter your password" required>
            </div>

            <a href="forgot_password.html" class="forgot-link">Forgot Password?</a>

            <button type="submit" class="btn-login">Sign In</button>
        </form>

        <p class="switch-text">New to the club? <a href="register_student.html">Register Here</a></p>
        <a href="index.html" class="back-home">← Back to Homepage</a>
    </div>

    <script>
        const loginParams = new URLSearchParams(window.location.search);
        const loginMessage = document.getElementById('message');
        if (loginParams.get('success')) {
            loginMessage.textContent = decodeURIComponent(loginParams.get('success'));
            loginMessage.style.color = '#0f6d3a';
        } else if (loginParams.get('error')) {
            loginMessage.textContent = decodeURIComponent(loginParams.get('error'));
            loginMessage.style.color = '#d93838';
        }
    </script>
</body>
</html>
