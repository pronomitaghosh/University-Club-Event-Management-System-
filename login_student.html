<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Login | CPC Portal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'DM Sans',sans-serif;}
body{background:#0e3d38;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.box{background:#fff;padding:40px 36px;border-radius:16px;width:360px;box-shadow:0 10px 30px rgba(0,0,0,.2);}
h2{color:#125a51;margin-bottom:6px;}
p.sub{color:#6b7f7d;font-size:.85rem;margin-bottom:24px;}
label{font-size:.8rem;font-weight:600;color:#1e2d2b;display:block;margin-bottom:6px;}
input{width:100%;padding:11px 14px;border:1px solid #cde5e2;border-radius:10px;margin-bottom:16px;font-size:.9rem;}
button{width:100%;padding:12px;background:#1a7a6e;color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-size:.95rem;}
button:hover{background:#125a51;}
.error{background:#fde8e8;color:#c0392b;padding:10px 14px;border-radius:8px;font-size:.85rem;margin-bottom:16px;}
</style>
</head>
<body>
<div class="box">
  <h2>Student Login</h2>
  <p class="sub">CPC-KiU Portal</p>

  <div class="error" id="errBox" style="display:none;"></div>

  <form id="studentLoginForm" action="student_login.php" method="POST" autocomplete="off" novalidate>
    <div style="position:absolute;left:-9999px;visibility:hidden;">
      <input type="text" name="fake_username" autocomplete="new-username">
      <input type="password" name="fake_password" autocomplete="new-password">
    </div>

    <label>Email</label>
    <input type="email" name="identifier" autocomplete="new-username" required placeholder="you@example.com" value="">

    <label>Password</label>
    <input type="password" name="password" autocomplete="new-password" required placeholder="••••••••" value="">

    <button type="submit">Login</button>
  </form>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const err = params.get('error');
if (err) {
  const box = document.getElementById('errBox');
  box.textContent = err;
  box.style.display = 'block';
}

const studentLoginForm = document.getElementById('studentLoginForm');
const studentInputs = studentLoginForm.querySelectorAll('input');
studentInputs.forEach((input) => {
  input.value = '';
  input.setAttribute('autocomplete', input.type === 'password' ? 'new-password' : 'new-username');
});

window.addEventListener('pageshow', function () {
  studentLoginForm.reset();
  studentInputs.forEach((input) => {
    input.value = '';
  });
});
</script>
</body>
</html>
