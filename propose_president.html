<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Propose Event – President</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --teal: #1a7a6e;
            --teal-dark: #125a51;
            --deep: #0e3d38;
            --gold: #c89b3c;
            --white: #ffffff;
            --bg: #f4f9f8;
            --border: #cde5e2;
            --sidebar-width: 260px;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: linear-gradient(180deg, var(--deep) 0%, var(--teal-dark) 100%);
            color: var(--white);
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 24px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.15rem;
        }

        .sidebar-menu {
            list-style: none;
            padding: 24px 16px;
            flex: 1;
        }

        .menu-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: rgba(255, 255, 255, 0.75);
            text-decoration: none;
            font-size: 0.95rem;
            border-radius: 10px;
        }

        .menu-link:hover,
        .menu-link.active {
            color: var(--white);
            background: rgba(255, 255, 255, 0.15);
        }

        .menu-link.active {
            border-left: 4px solid var(--gold);
        }

        .main-wrapper {
            margin-left: var(--sidebar-width);
            flex: 1;
            padding: 40px;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--border);
            max-width: 600px;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        input,
        textarea {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: inherit;
        }

        .btn-submit {
            padding: 12px;
            background: var(--teal);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="logo">👑</div>
            <h2>Club President</h2>
        </div>
        <ul class="sidebar-menu">
            <li><a href="dashboard_president.html" class="menu-link">📊 Dashboard</a></li>
            <li><a href="members_president.html" class="menu-link">👥 Club Members</a></li>
            <li><a href="propose_president.html" class="menu-link active">➕ Propose Event</a></li>
            <li><a href="budget_president.html" class="menu-link">📜 Budget Requests</a></li>
        </ul>
        <div class="sidebar-footer" style="padding: 20px 24px;"><a href="login.html"
                style="color: #ff8a8a; text-decoration:none; font-weight:600;">🚪 Logout</a></div>
    </div>
    <div class="main-wrapper">
        <h1 style="font-family:'Playfair Display', serif; margin-bottom: 20px;">Create New Event Proposal</h1>
        <div class="form-card">
            <form onsubmit="event.preventDefault(); alert('Proposal Sent to Central Admin!');">
                <div class="form-group"><label>Event Title</label><input type="text"
                        placeholder="e.g. National Cyber Hackathon" required></div>
                <div class="form-group"><label>Event Date & Time</label><input type="datetime-local" required></div>
                <div class="form-group"><label>Expected Venue</label><input type="text"
                        placeholder="e.g. Central Auditorium" required></div>
                <div class="form-group"><label>Description</label><textarea rows="4"
                        placeholder="Describe the goal of the event..."></textarea></div>
                <button type="submit" class="btn-submit">Submit Proposal</button>
            </form>
        </div>
    </div>
</body>

</html>
